services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4010
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3010}
    ports:
      - "127.0.0.1:4010:4010"
    restart: unless-stopped

  caddy:
    image: caddy:2.8
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
